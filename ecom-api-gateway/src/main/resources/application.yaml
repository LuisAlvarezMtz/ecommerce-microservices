spring:
  application:
    name: ecom-api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ecom-order-service
              uri: http://localhost:8080
              predicates:
                - Path=/order/**
server:
  port: 9090
eureka:
  client:
    service-url:
      default-zone:
        http://localhost:8761